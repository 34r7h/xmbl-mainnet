<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>XMBL Wallet — harness</title>
</head>
<body>
  <!-- TEST HARNESS ONLY (not shipped). Provides a faithful chrome.* so the REAL built popup.js runs
       in a normal tab: chrome.storage.local is an in-memory store with chrome's callback semantics,
       and chrome.runtime.sendMessage emulates the stub background the extension ships with. All popup
       UI + @xmbl/lng compile + contract-runtime execution run unmodified. -->
  <script>
    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push('error: ' + (e.message || e.error)));
    window.addEventListener('unhandledrejection', (e) => window.__errors.push('unhandledrejection: ' + (e.reason && (e.reason.message || e.reason))));
    const _store = {};
    // Mirrors src/background.js exactly (the shipped stub node bridge): stateful nodeRunning,
    // mock balance/txId. Keeps the harness faithful to what the real service worker returns.
    const _bg = { nodeRunning: false };
    globalThis.chrome = {
      runtime: {
        id: 'xmbl-harness',
        lastError: null,
        sendMessage: (msg, cb) => {
          let resp = {};
          if (msg && msg.type === 'getBalance') resp = { balance: 0 };
          else if (msg && msg.type === 'getNodeStatus') resp = { running: _bg.nodeRunning, peers: 0, height: 0 };
          else if (msg && msg.type === 'sendTransaction') resp = { txId: 'mock-tx-id-' + Date.now() };
          else if (msg && msg.type === 'startNode') { _bg.nodeRunning = true; resp = { success: true }; }
          else if (msg && msg.type === 'stopNode') { _bg.nodeRunning = false; resp = { success: true }; }
          setTimeout(() => cb && cb(resp), 0);
        },
      },
      storage: {
        local: {
          get: (keys, cb) => {
            let result = {};
            if (typeof keys === 'string') { if (keys in _store) result[keys] = _store[keys]; }
            else if (Array.isArray(keys)) keys.forEach((k) => { if (k in _store) result[k] = _store[k]; });
            else if (keys && typeof keys === 'object') Object.keys(keys).forEach((k) => { result[k] = (k in _store) ? _store[k] : keys[k]; });
            else result = { ..._store };
            setTimeout(() => cb && cb(result), 0);
          },
          set: (obj, cb) => { Object.assign(_store, obj); setTimeout(() => cb && cb(), 0); },
          remove: (keys, cb) => { (Array.isArray(keys) ? keys : [keys]).forEach((k) => delete _store[k]); setTimeout(() => cb && cb(), 0); },
        },
      },
    };
    window.__store = _store;
  </script>
  <div id="app"></div>
  <script src="dist/popup.js"></script>
</body>
</html>
