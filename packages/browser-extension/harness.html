<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>XMBL Wallet — harness</title>
</head>
<body>
  <!-- TEST HARNESS ONLY (not shipped). Provides a faithful chrome.* so the REAL built popup.js runs
       in a normal tab: chrome.storage.local is an in-memory store with chrome's callback semantics,
       and chrome.runtime.sendMessage emulates the responses the shipped RPC bridge (src/background.js)
       returns when CONNECTED to a freshly-started LocalDevnet (balance/peers/height 0, node toggles
       on start/stop) — so the popup workflow runs hermetically without spawning a real devnet. The
       bridge↔devnet path itself is proven against a REAL devnet RPC in tests/background-bridge.test.mjs.
       All popup UI + @xmbl/lng compile + contract-runtime execution run unmodified. -->
  <script>
    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push('error: ' + (e.message || e.error)));
    window.addEventListener('unhandledrejection', (e) => window.__errors.push('unhandledrejection: ' + (e.reason && (e.reason.message || e.reason))));
    const _store = {};
    // Emulates the RPC bridge's responses when CONNECTED to a fresh LocalDevnet (connected:true,
    // stateful nodeRunning, 0 balance/peers/height). Keeps the popup workflow hermetic; the real
    // bridge↔devnet path is proven in tests/background-bridge.test.mjs against a live devnet RPC.
    const _bg = { nodeRunning: false };
    globalThis.chrome = {
      runtime: {
        id: 'xmbl-harness',
        lastError: null,
        sendMessage: (msg, cb) => {
          let resp = {};
          if (msg && msg.type === 'getBalance') resp = { balance: 0, connected: true };
          else if (msg && msg.type === 'getNodeStatus') resp = { running: _bg.nodeRunning, peers: 0, height: 0, connected: true };
          else if (msg && msg.type === 'sendTransaction') resp = { txId: 'dtx_harness_' + Date.now(), connected: true };
          else if (msg && msg.type === 'startNode') { _bg.nodeRunning = true; resp = { success: true, connected: true }; }
          else if (msg && msg.type === 'stopNode') { _bg.nodeRunning = false; resp = { success: true, connected: true }; }
          else if (msg && msg.type === 'getStateRoot') resp = { root: '0x' + '00'.repeat(16), pooled: 0, landed: 0, connected: true };
          // Crypto host-cap verdicts — shaped exactly like the real devnet capability responses
          // (capabilities.js). The REAL primitives are proven in background-bridge.test.mjs.
          else if (msg && msg.type === 'zkProof') resp = { ok: true, derivedX: String(msg.derivedX), derivedY: '254430811', honestVerifies: true, tamperedRejected: true, scheme: 'xzk', connected: true };
          else if (msg && msg.type === 'heAdd') resp = { ok: true, a: msg.a, b: msg.b, sum: (msg.a + msg.b) % 2, expected: (msg.a + msg.b) % 2, scheme: 'cubic-LWE', connected: true };
          else if (msg && msg.type === 'sigVerify') resp = { ok: true, message: msg.message, signedVerifies: true, tamperedRejected: true, scheme: 'Cubic-SIG', connected: true };
          else if (msg && msg.type === 'seal') resp = { ok: true, roundTrip: true, scheme: 'cubic-LWE KEM seal', connected: true };
          else if (msg && msg.type === 'getDevnetUrl') resp = { url: 'http://127.0.0.1:8646' };
          else if (msg && msg.type === 'setDevnetUrl') resp = { url: (msg.url || 'http://127.0.0.1:8646'), connected: true, running: _bg.nodeRunning };
          setTimeout(() => cb && cb(resp), 0);
        },
      },
      storage: {
        local: {
          get: (keys, cb) => {
            let result = {};
            if (typeof keys === 'string') { if (keys in _store) result[keys] = _store[keys]; }
            else if (Array.isArray(keys)) keys.forEach((k) => { if (k in _store) result[k] = _store[k]; });
            else if (keys && typeof keys === 'object') Object.keys(keys).forEach((k) => { result[k] = (k in _store) ? _store[k] : keys[k]; });
            else result = { ..._store };
            setTimeout(() => cb && cb(result), 0);
          },
          set: (obj, cb) => { Object.assign(_store, obj); setTimeout(() => cb && cb(), 0); },
          remove: (keys, cb) => { (Array.isArray(keys) ? keys : [keys]).forEach((k) => delete _store[k]); setTimeout(() => cb && cb(), 0); },
        },
      },
    };
    window.__store = _store;
  </script>
  <div id="app"></div>
  <script src="dist/popup.js"></script>
</body>
</html>
