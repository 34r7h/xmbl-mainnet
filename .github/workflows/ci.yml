name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS packages (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # HARD GATE. The eight protocol packages carry the consensus/crypto/isolation
      # invariants; their suites must pass or the build fails. No continue-on-error.
      - run: npm run test:protocol
      # The 8 protocol packages are plain ESM (no build). Only the app packages build,
      # and their framework toolchains (electron-builder, webpack, vite) are exercised in
      # the packaging workflow, not gated here — advisory to keep the release path clear.
      - run: npm run build --workspaces --if-present
        continue-on-error: true
      # App/tooling package suites (cli, desktop-app) are ported incrementally; advisory
      # until each package's runner config lands, so releases aren't blocked on setup.
      - run: npm run test --workspaces --if-present
        continue-on-error: true

  rust:
    name: Rust crates (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  wasm:
    name: MAYO WASM artifact reproduces byte-for-byte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # THE PIN. emcc codegen is version-specific, so the version is the gate: this must stay
      # equal to EMSDK_PIN in packages/identity/build-mayo-cube-wasm.sh. Bumping it WILL change
      # the digest — that is a deliberate re-pin (rebuild, re-record, explain in MAYO-PROVENANCE.md),
      # never a silent edit.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # HARD GATE (T2.1-b). Rebuilds the signing artifact from the vendored C on a DIFFERENT host
      # and operating system than the one that committed it, and fails unless the bytes match the
      # committed mayo.wasm/mayo.cjs and the digests recorded in the script. An auditor reviewing
      # the C can run the same two commands and get the same binary.
      - name: Rebuild MAYO-cube WASM and compare byte-for-byte
        run: bash packages/identity/build-mayo-cube-wasm.sh --check
