name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS packages (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present
      # Module test suites are ported into the monorepo runner incrementally; advisory
      # until each package's runner config lands, so releases aren't blocked on setup.
      - run: npm run test --workspaces --if-present
        continue-on-error: true

  rust:
    name: Rust crates (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  wasm:
    name: MAYO WASM artifact builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build MAYO-cube WASM
        working-directory: packages/identity
        run: npm run build:wasm --if-present
