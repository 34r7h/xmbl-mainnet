name: Release

# Tag-driven, dual-registry release. Push a semver tag to cut a release:
#   git tag v0.1.17 && git push origin v0.1.17
# Publishes every @xmbl/* package to npm and every xmbl-* crate to crates.io at the
# tagged version, then attaches cross-platform build artifacts to a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]
  # Finish an interrupted release without re-tagging. crates.io rate-limits NEW crates to a burst
  # of 5 then one per hour, so a first release of more than five crates CANNOT complete in one run
  # and there has to be a way to resume. Dispatch runs the cargo job alone; npm and packaging are
  # tag-only, and the cargo job skips whatever is already on the registry.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to crates.io (e.g. 0.1.15)"
        required: true

permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  npm:
    name: Publish @xmbl/* to npm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 + tags: the version guard below counts against the release tags, and a shallow
      # checkout has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # THE TAG AND THE TREE MUST BE THE SAME VERSION, and that version must be a legal next one.
      # `git tag v0.1.19` on a tree carrying 0.1.17 would otherwise publish 0.1.17 under a name
      # nobody can find it by, and the whole point of a tag-only release is that the tag is the
      # decision — so it is the thing that has to be checked before npm sees anything.
      - name: Version guard (tag matches the tree, and the bump is legal)
        run: node scripts/version-guard.mjs --tag "${GITHUB_REF_NAME}"
      # HARD GATE before any publish: the protocol invariants must hold at the tag.
      - run: npm run test:protocol
      # Published packages are plain ESM; app builds happen in packaging, not here.
      - run: npm run build --workspaces --if-present
        continue-on-error: true
      # Publish every public workspace at the tag version. --provenance signs the
      # supply chain; workspaces marked "private" are skipped automatically.
      - run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cargo:
    name: Publish xmbl-* to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Publish in dependency order so path deps resolve to already-published versions.
      - name: cargo publish (ordered)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          VERSION="${{ inputs.version || '' }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME#v}"
          order=(xmbl-identity xmbl-networking xmbl-cubic-ledger xmbl-state-machine \
                 xmbl-consensus xmbl-storage-compute xmbl-zero-knowledge xmbl-core)
          # IDEMPOTENT. A rerun of this job must not fail on a crate it already published: after the
          # 2026-09-21 429 (crates.io caps NEW crates at 5 in a burst, then 1 per hour) five of the
          # eight were live and a plain rerun died on "crate version already uploaded".
          published() {
            curl -sf -m 20 -H 'User-Agent: xmbl-release' \
              "https://crates.io/api/v1/crates/$1/$2" >/dev/null 2>&1
          }
          failed=()
          for c in "${order[@]}"; do
            echo "::group::publish $c $VERSION"
            if published "$c" "$VERSION"; then
              echo "already on crates.io at $VERSION — skipping"
              echo "::endgroup::"
              continue
            fi
            # Retry the NEW-crate rate limit rather than losing the whole run to it. The window is
            # an hour, so this waits out at most one refill per crate.
            ok=0
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "$c" --allow-dirty; then ok=1; break; fi
              if published "$c" "$VERSION"; then ok=1; break; fi
              echo "publish of $c failed (attempt $attempt) — waiting 15m for the rate-limit refill"
              sleep 900
            done
            [ "$ok" = 1 ] || failed+=("$c")
            # let the index catch up before publishing a dependent crate
            sleep 20
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::crates still unpublished at $VERSION: ${failed[*]}"
            exit 1
          fi
          echo "all 8 crates live at $VERSION"

  # 0.2.0 is unremovable and stays semver-max, so its tombstone must keep pointing at the version
  # that actually shipped. Re-run on every release rather than leaving it stale.
  tombstone:
    name: Re-point the 0.2.0 tombstone
    needs: [npm]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/tombstone-020.yml
    secrets: inherit

  artifacts:
    name: Attach packaged builds
    # Gated on npm ONLY, and deliberately not on cargo. crates.io had no token from the first tag
    # until 2026-09-21, so `needs: [npm, cargo]` skipped this job on EVERY release ever cut and the
    # repo reached v0.1.13 with zero downloadable builds for any platform. A registry the packages
    # do not depend on must never be able to withhold the binaries.
    needs: [npm]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/package.yml
    secrets: inherit
