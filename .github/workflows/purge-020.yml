name: Purge 0.2.0

# Remove 0.2.0 from every @xmbl package that still carries it.
#
# Why this runs in CI rather than on a laptop: the account sits at auth-and-writes, so an
# interactive `npm unpublish` answers EOTP and needs a browser approval per package. The
# NPM_TOKEN this repo already publishes with is an automation token — 2FA does not apply to it,
# so the whole purge runs unattended in one pass.
#
# ORDER. npm refuses a version-level unpublish while a PUBLISHED version whose range MATCHES the
# target still depends on it. The 0.1.x line pins `^0.1.12`/`^0.1.16`, which cannot match 0.2.0,
# so the shipping release does NOT block this. The only matching edges are 0.2.0 -> 0.2.0:
#   consensus -> identity, cubic-ledger      cubic-ledger -> identity
#   storage-compute -> identity              networking, simulator, state-machine,
#                                            zero-knowledge, identity -> nothing
# so dependents go before dependencies. Three passes, because the registry's dependents index
# lags a removal by minutes and a stale index is what stranded the 2026-09-22 laptop runs.
#
# Unpublish window closes 2026-09-24T03:06:14Z.

on:
  workflow_dispatch:

jobs:
  purge:
    name: Unpublish 0.2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: unpublish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          ORDER="networking simulator state-machine zero-knowledge consensus storage-compute cubic-ledger identity"
          ALL="cli consensus contracts core cubic-ledger identity lng networking simulator state-machine storage-compute zero-knowledge"

          carries() {
            curl -s "https://registry.npmjs.org/@xmbl/$1?cb=$RANDOM$RANDOM" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(j.versions&&j.versions['0.2.0']?'1':'0')}catch(e){process.stdout.write('1')}})"
          }

          for pass in 1 2 3; do
            echo "::group::pass $pass"
            for p in $ORDER; do
              [ "$(carries "$p")" = "1" ] || { echo "gone      @xmbl/$p@0.2.0"; continue; }
              if out=$(npm unpublish "@xmbl/$p@0.2.0" 2>&1); then
                echo "REMOVED   @xmbl/$p@0.2.0"
              else
                echo "stuck     @xmbl/$p@0.2.0 :: $(echo "$out" | grep -aoE 'Failed criteria.*|has dependent packages|E[0-9]{3}.*' | head -1)"
              fi
              sleep 5
            done
            echo "::endgroup::"
            # let the dependents index settle before the next pass
            [ "$pass" = 3 ] || sleep 120
          done

          # COUNT AFTER. The registry's version list decides this, not exit codes.
          present=0; still=""
          for p in $ALL; do
            [ "$(carries "$p")" = "1" ] && { present=$((present+1)); still="$still $p"; }
          done
          echo "---- 0.2.0 present on $present/12${still:+ —$still} ----"
          if [ "$present" != 0 ]; then
            echo "::error::0.2.0 still on $present packages:$still"
            exit 1
          fi
          echo "0.2.0 GONE from all twelve."
