name: Retire 0.2.0

# ONE-OFF. 0.2.0 was published in error: the next version on this line is 0.1.12, which is now
# live and carries the `latest` tag on every package. Unpublish is refused to any automation token
# (npm requires 2FA for it), so this marks 0.2.0 deprecated instead. Deleted once it has run.
on:
  workflow_dispatch:

jobs:
  unpublish:
    name: Deprecate @xmbl/*@0.2.0 on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm deprecate (all 12)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          fail=0
          MSG="0.2.0 was cut in error and is not part of this version line - use 0.1.12"
          for p in zero-knowledge identity contracts core consensus cubic-ledger \
                   state-machine storage-compute networking lng cli simulator; do
            echo "::group::@xmbl/$p@0.2.0"
            if npm deprecate "@xmbl/$p@0.2.0" "$MSG"; then
              echo "deprecated @xmbl/$p@0.2.0"
            else
              echo "FAILED @xmbl/$p@0.2.0"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
