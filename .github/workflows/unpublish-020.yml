name: Unpublish 0.2.0

# ONE-OFF. 0.2.0 was published in error: the next version on this line is 0.1.12, which is now
# live and carries the `latest` tag on every package. This removes the orphaned 0.2.0 from npm.
# Deleted from the repo once it has run.
on:
  workflow_dispatch:

jobs:
  unpublish:
    name: Remove @xmbl/*@0.2.0 from npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm unpublish (all 12)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          fail=0
          for p in zero-knowledge identity contracts core consensus cubic-ledger \
                   state-machine storage-compute networking lng cli simulator; do
            echo "::group::@xmbl/$p@0.2.0"
            if npm unpublish "@xmbl/$p@0.2.0" --force; then
              echo "removed @xmbl/$p@0.2.0"
            else
              echo "FAILED @xmbl/$p@0.2.0"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
