<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XMBL Contract Lab</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #ffffff;
        --ink: #12161c;
        --ink-soft: #4a5360;
        --muted: #8a93a0;
        --line: #e2e6ec;
        --line-strong: #cfd5de;
        --accent: #0f7c8a;
        --accent-ink: #0a5a66;
        --accent-wash: #e3f2f3;
        --ok: #1f7a4d;
        --ok-wash: #e6f4ec;
        --bad: #b23b3b;
        --bad-wash: #fbeaea;
        --warn-wash: #fdf3e3;
        --warn-line: #e8c98a;
        --info-wash: #eef1fb;
        --info-line: #c3cbf0;
        --code-bg: #0f1720;
        --code-ink: #d7e2ea;
        --radius: 10px;
        --mono: 'SFMono-Regular', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0e1217;
          --panel: #161c24;
          --ink: #e7ecf2;
          --ink-soft: #a9b3bf;
          --muted: #6e7887;
          --line: #263040;
          --line-strong: #33405231;
          --accent: #38c2d1;
          --accent-ink: #7fd9e3;
          --accent-wash: #123036;
          --ok: #5fcf92;
          --ok-wash: #12301f;
          --bad: #eb8a8a;
          --bad-wash: #331818;
          --warn-wash: #2c2413;
          --warn-line: #5c4c22;
          --info-wash: #1b1f33;
          --info-line: #2f3660;
          --code-bg: #0a0f15;
          --code-ink: #cdd9e3;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
      .lab { max-width: 940px; margin: 0 auto; padding: 24px 20px 64px; }
      .mono { font-family: var(--mono); }
      .break { word-break: break-all; }
      .muted { color: var(--muted); }

      .lab-head { margin-bottom: 20px; }
      .brand { display: flex; gap: 14px; align-items: center; }
      .logo { font-size: 30px; color: var(--accent); line-height: 1; }
      .lab-head h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
      .sub { margin: 0; color: var(--ink-soft); font-size: 13px; }

      .stage { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-top: 16px; }
      .stage.disabled { opacity: 0.55; }
      .stage-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
      .stage-head h2 { font-size: 16px; margin: 0; }
      .stage-note { color: var(--muted); font-size: 12px; }

      .chip { display: inline-flex; align-items: center; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--ink-soft); font-family: var(--mono); }
      .chip.num { background: var(--accent); color: #fff; font-weight: 600; min-width: 22px; justify-content: center; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .chip.num { color: #06232a; } }
      .chip.field { background: var(--accent-wash); color: var(--accent-ink); }
      .chip.entry { background: var(--info-wash); color: var(--ink-soft); border: 1px solid var(--info-line); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }

      .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
      .row.wrap { flex-wrap: wrap; }
      .row.between { justify-content: space-between; }
      .lbl { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }
      .blk-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 16px 0 8px; }
      .field-block { margin-top: 8px; }

      textarea.code { width: 100%; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line-strong); border-radius: 8px; padding: 14px; font-family: var(--mono); font-size: 13px; line-height: 1.55; resize: vertical; tab-size: 2; }
      .select { background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 7px; padding: 6px 10px; font-size: 13px; font-family: var(--sans); }

      .btn { background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--sans); }
      .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { background: var(--accent-ink); color: #fff; }
      .btn.ghost { background: transparent; border-style: dashed; font-size: 12px; padding: 5px 10px; }

      .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .kv .k { color: var(--ink-soft); font-size: 13px; }
      .kv .v { font-size: 13px; }

      .banner { border-radius: 8px; padding: 11px 13px; font-size: 12.5px; margin: 12px 0; line-height: 1.5; }
      .banner.warn { background: var(--warn-wash); border: 1px solid var(--warn-line); }
      .banner.info { background: var(--info-wash); border: 1px solid var(--info-line); }
      .banner.err { background: var(--bad-wash); border: 1px solid var(--bad); color: var(--bad); }
      .banner code { font-family: var(--mono); font-size: 11.5px; background: rgba(127,127,127,0.14); padding: 1px 5px; border-radius: 4px; }

      .state-grid { display: flex; flex-wrap: wrap; gap: 10px; }
      .state-cell { background: var(--accent-wash); border: 1px solid var(--accent-wash); border-radius: 8px; padding: 9px 14px; min-width: 110px; }
      .sc-name { font-size: 11px; color: var(--accent-ink); text-transform: uppercase; letter-spacing: 0.05em; }
      .sc-val { font-size: 18px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

      .calls { display: flex; flex-direction: column; gap: 8px; }
      .call-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
      .call-row .ep { font-family: var(--mono); font-size: 13px; color: var(--accent-ink); min-width: 96px; }
      .call-row .args { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
      input.arg { width: 92px; background: var(--bg); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
      input.arg:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }

      .log { background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
      .log:empty::after { content: 'calls appear here'; color: #5a6b78; }
      .log-line.ok { color: #7fe0ab; }
      .log-line.bad { color: #f2a0a0; }
      .log-line.muted { color: #6a7a87; }

      pre.descriptor { background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 14px; font-size: 12px; line-height: 1.5; overflow-x: auto; margin: 0; }
    </style>
  </head>
  <body style="margin: 0">
    <div id="app"></div>
    <script type="module" src="./contract-lab.js"></script>
  </body>
</html>
