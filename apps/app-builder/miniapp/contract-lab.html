<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XMBL Contract Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" />
  <style>
    /* ── Impeccable-calibrated design system (impeccable.style): Albert Sans; a single
       periwinkle-indigo accent over deliberate cool neutrals (no beige); 8px fields,
       3px pills, 12px cards; hover lift 1px/150ms, press scale .96/160ms; calm by default.
       Tokens are scoped to #app so they resolve identically on BOTH handoff surfaces — the
       opaque-origin iframe (where :root works) AND the shadow-DOM feed (where it does not). */
    #app {
      --font: 'Albert Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      --paper: #f5f6f9;
      --surface: #ffffff;
      --surface-2: #f0f2f7;
      --ink: #141925;
      --gray-1: #59616f;
      --gray-3: #9aa3b2;
      --line: #e4e7ee;
      --accent: #5162f6;
      --accent-weak: #eaecfe;
      --accent-ink: #2f3ccc;
      --success: #12a150;
      --success-weak: #e4f6ec;
      --danger: #e5484d;
      --danger-weak: #fdeaea;
      --radius-card: 12px;
      --radius-field: 8px;
      --radius-pill: 3px;
      --shadow: 0 1px 2px rgba(20, 25, 37, .05), 0 1px 1px rgba(20, 25, 37, .04);
      --shadow-lift: 0 4px 14px rgba(20, 25, 37, .10);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--paper);
      display: block;
      min-height: 100%;
      padding: 22px clamp(14px, 4vw, 40px) 56px;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      #app {
        --paper: #0c0f15;
        --surface: #141922;
        --surface-2: #1b212c;
        --ink: #e9edf5;
        --gray-1: #98a2b3;
        --gray-3: #5c6575;
        --line: #232a36;
        --accent: #8290ff;
        --accent-weak: #1c2340;
        --accent-ink: #aab3ff;
        --success: #3ecf7f;
        --success-weak: #12251b;
        --danger: #f2696d;
        --danger-weak: #2a1417;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4);
        --shadow-lift: 0 6px 20px rgba(0, 0, 0, .5);
      }
    }
    #app * { box-sizing: border-box; }
    #app h1, #app p { margin: 0; }
    .mono { font-family: var(--mono); }

    /* ── header ── */
    .head { margin-bottom: 18px; }
    .brand { display: flex; gap: 14px; align-items: center; }
    .logo {
      width: 40px; height: 40px; flex: none; display: grid; place-items: center;
      font-size: 20px; color: #fff; background: var(--accent); border-radius: var(--radius-field);
    }
    .title { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
    .sub { font-size: 13px; color: var(--gray-1); margin-top: 2px; }

    /* ── mode bar ── */
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    .tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-field); padding: 3px; gap: 2px; }
    .tab {
      appearance: none; border: 0; background: transparent; cursor: pointer; font: inherit;
      color: var(--gray-1); padding: 6px 14px; border-radius: 6px; font-weight: 500; transition: background .15s, color .15s;
    }
    .tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .pick { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--gray-1); }

    /* ── layout ── */
    .cols { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
    .right { display: flex; flex-direction: column; gap: 18px; }

    /* ── panels (cards) ── */
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); box-shadow: var(--shadow); overflow: hidden; }
    .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .ph-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gray-1); }
    .ph-note { font-size: 12px; color: var(--gray-3); }
    .sub-h { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--gray-3); padding: 14px 16px 6px; }
    .compile-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    /* ── buttons ── */
    .btn {
      appearance: none; font: inherit; font-weight: 500; cursor: pointer; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-field);
      padding: 8px 14px; transition: transform .15s ease, box-shadow .15s ease, background .15s, border-color .15s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); border-color: var(--gray-3); }
    .btn:active { transform: scale(.96); box-shadow: none; }
    .btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
    .btn.ghost { background: transparent; }
    .btn.danger { color: var(--danger); border-color: var(--danger-weak); background: var(--danger-weak); }
    .btn.sm { padding: 5px 11px; font-size: 12px; }

    /* ── code editor ── */
    textarea.code {
      width: 100%; border: 0; border-radius: 0; resize: vertical; padding: 14px 16px;
      font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--ink);
      background: var(--surface); outline: none; display: block;
    }
    .parse-msg { font-size: 12px; color: var(--gray-1); min-height: 1.2em; padding: 0 2px; }
    .parse-msg.ok { color: var(--success); }
    .parse-msg.bad { color: var(--danger); font-family: var(--mono); }
    #app [hidden] { display: none !important; }

    /* ── visual builder ── */
    .vb { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 16px; }
    .vb-sec { display: flex; flex-direction: column; gap: 8px; }
    .vb-sec-h { display: flex; align-items: center; justify-content: space-between; }
    .vb-sec-h > span { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gray-3); }
    .row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .name-row .cname { font-weight: 600; min-width: 160px; }
    .tok { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); }
    .tok.dim { color: var(--gray-3); }
    .in {
      font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius-field); padding: 5px 8px; min-width: 60px; max-width: 150px;
      transition: border-color .15s, box-shadow .15s;
    }
    .in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
    .in.name { max-width: 130px; font-family: var(--mono); }
    .in.sm { max-width: 80px; padding: 3px 6px; }
    .in.num { max-width: 70px; font-family: var(--mono); }
    .in.operand { max-width: 110px; font-family: var(--mono); }
    .sel {
      font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius-field); padding: 5px 8px; cursor: pointer; max-width: 230px;
    }
    .sel.op { max-width: 86px; font-family: var(--mono); }
    .sel.vis { max-width: 92px; }
    .sel.sample { max-width: 330px; }
    .x {
      appearance: none; border: 0; background: transparent; color: var(--gray-3); cursor: pointer;
      font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: var(--radius-pill); transition: color .15s, background .15s;
    }
    .x:hover { color: var(--danger); background: var(--danger-weak); }
    .add {
      appearance: none; cursor: pointer; font: inherit; font-weight: 500; font-size: 12px; color: var(--accent-ink);
      background: var(--accent-weak); border: 1px dashed transparent; border-radius: var(--radius-field); padding: 5px 11px; transition: background .15s;
    }
    .add:hover { background: var(--surface); border-color: var(--accent); }
    .add.sm { padding: 3px 9px; font-size: 11.5px; }

    .method { border: 1px solid var(--line); border-radius: var(--radius-field); background: var(--surface-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; }
    .method-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .params { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .param { display: inline-flex; align-items: center; gap: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 1px 3px 1px 6px; }
    .block { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 2px 12px; border-left: 2px solid var(--line); }
    .stmt { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-field); padding: 6px 8px; }
    .stmt.nested { align-items: flex-start; }
    .stmt .skind { max-width: 92px; font-weight: 500; color: var(--accent-ink); }
    .expr { display: inline-flex; align-items: center; gap: 5px; }
    .branch-cols { display: flex; gap: 14px; flex-wrap: wrap; width: 100%; }
    .branch-cols > div { flex: 1; min-width: 150px; }
    .mini { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gray-3); margin-bottom: 2px; }
    .advanced { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 2px; }
    .advanced code { font-family: var(--mono); font-size: 11.5px; color: var(--gray-1); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
    .badge { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--gray-1); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 1px 6px; }

    /* ── test: state tiles ── */
    .state-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 0 16px 4px; }
    .tile { border: 1px solid var(--line); border-radius: var(--radius-field); background: var(--surface-2); padding: 10px 12px; transition: background .2s, border-color .2s; }
    .tile.priv { border-style: dashed; }
    .tile-k { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--gray-1); }
    .tile-v { font-family: var(--mono); font-size: 19px; font-weight: 600; color: var(--ink); margin-top: 3px; font-variant-numeric: tabular-nums; word-break: break-all; }
    .tile.flash { animation: flash .5s ease; }
    @keyframes flash {
      0% { background: var(--accent); border-color: var(--accent); }
      35% { background: var(--accent-weak); border-color: var(--accent); }
      100% { background: var(--surface-2); border-color: var(--line); }
    }
    .tile.flash .tile-v { animation: flashv .5s ease; }
    @keyframes flashv { 0% { color: #fff; } 100% { color: var(--ink); } }

    /* ── test: calls ── */
    .calls { display: flex; flex-direction: column; gap: 7px; padding: 0 16px; }
    .call-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--radius-field); background: var(--surface-2); padding: 7px 10px; }
    .call-sig { display: inline-flex; align-items: center; gap: 2px; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; }
    .ep { font-weight: 600; color: var(--accent-ink); }
    .paren { color: var(--gray-3); }
    .arg { font-family: var(--mono); font-size: 12.5px; width: 66px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
    .arg:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }

    /* ── test: trace ── */
    .trace { display: flex; flex-direction: column; gap: 2px; padding: 0 16px; max-height: 180px; overflow-y: auto; font-family: var(--mono); font-size: 12px; }
    .tline { padding: 3px 8px; border-radius: 6px; }
    .tline.ok { color: var(--success); background: var(--success-weak); }
    .tline.bad { color: var(--danger); background: var(--danger-weak); }
    .tline.muted { color: var(--gray-3); }
    .note { font-size: 11.5px; line-height: 1.5; color: var(--gray-1); padding: 12px 16px 16px; }
    .note.tiny { font-size: 11px; padding: 0; color: var(--gray-3); }
    .muted { color: var(--gray-3); padding: 4px 0; }

    /* ── deploy ── */
    .deploy-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; }
    .k { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--gray-3); }
    .v { font-size: 13px; color: var(--ink); }
    .v.wrap { word-break: break-all; }
    .live-badge { font-size: 12px; font-weight: 600; color: var(--success); background: var(--success-weak); border: 1px solid var(--success); border-radius: var(--radius-field); padding: 7px 12px; }
    pre.descriptor { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--gray-1); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-field); padding: 12px; margin: 0; overflow-x: auto; }

    @media (prefers-reduced-motion: reduce) {
      #app *, #app *::before, #app *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./contract-lab.js"></script>
</body>
</html>
